        .controls {

        .controls select, .controls input {

        .controls button {

        .table-container {

        .chart-controls {

        .progress-bar-wrapper {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;

            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        .progress-text {
            text-align: center;
            color: #667eea;
            font-size: 16px;
            font-weight: 600;

        .progress-details {

    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        function EmraldAnalyzer() {
            const [file, setFile] = useState(null);
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [selectedIteration, setSelectedIteration] = useState('all');
            const [stateFilter, setStateFilter] = useState('');
            const [activeTab, setActiveTab] = useState('transitions');
            const [selectedStatesForPlot, setSelectedStatesForPlot] = useState([]);
            const [systemFailureStates, setSystemFailureStates] = useState([]);
            const [importanceMeasures, setImportanceMeasures] = useState(null);
            const [bootstrapResults, setBootstrapResults] = useState(null);
            const [numBootstrap, setNumBootstrap] = useState(100);
            const [isCalculating, setIsCalculating] = useState(false);
            const [progress, setProgress] = useState({ percent: 0, message: '' });
            const [showProgress, setShowProgress] = useState(false);
            const chartRef = useRef(null);
            const chartInstanceRef = useRef(null);
            const fvChartRef = useRef(null);
            const rawChartRef = useRef(null);
            const rrwChartRef = useRef(null);
            const birnbaumChartRef = useRef(null);
            const bpChartRef = useRef(null);
            const combinedChartRef = useRef(null);

            // Parse time string to hours using formula: TIME = (DD*24) + HH + (MM/60) + (SS/3600) + (0.1*MS/3600)
            const parseTimeToHours = (timeStr) => {
                if (!timeStr) return 0;
                const match = timeStr.match(/(\d+)\.(\d+):(\d+):(\d+)\.(\d+)/);
                if (!match) return 0;
                
                const [, DD, HH, MM, SS, MS] = match;
                const days = parseInt(DD);
                const hours = parseInt(HH);
                const minutes = parseInt(MM);
                const seconds = parseInt(SS);
                const milliseconds = parseInt(MS);
                
                // Apply formula: TIME = (DD*24) + HH + (MM/60) + (SS/3600) + (0.1*MS/3600)
                const timeInHours = (days * 24) + hours + (minutes / 60) + (seconds / 3600) + (0.1 * milliseconds / 3600);
                
                return timeInHours;
            };

            // Format time in hours with appropriate precision
            const formatTime = (hours) => {
                return hours.toFixed(6);
            };

            // Calculate importance measures based on MATLAB code
            const calculateImportanceMeasures = async () => {
                if (!data || systemFailureStates.length === 0) return;

                setShowProgress(true);
                setProgress({ percent: 0, message: 'Initializing importance measure calculation...' });
                
                await new Promise(resolve => setTimeout(resolve, 100));

                const N = data.iterations.length;
                const states = data.states;
                
                setProgress({ percent: 10, message: 'Creating binary matrices...' });
                await new Promise(resolve => setTimeout(resolve, 0));
                
                // Create binary matrices
                const x = [];
                const y = [];
                
                for (let i = 0; i < data.iterations.length; i++) {
                    const iter = data.iterations[i];
                    const row = [];
                    let systemFailed = false;
                    
                    states.forEach(state => {
                        const stateEntered = iter.states[state] && iter.states[state].length > 0;
                        row.push(stateEntered ? 1 : 0);
                        
                        if (systemFailureStates.includes(state) && stateEntered) {
                            systemFailed = true;
                        }
                    });
                    
                    x.push(row);
                    y.push(systemFailed ? 1 : 0);
                    
                    if (i % 1000 === 0) {
                        const percent = 10 + Math.floor((i / data.iterations.length) * 20);
                        setProgress({ 
                            percent, 
                            message: `Processing iterations... ${i.toLocaleString()} / ${N.toLocaleString()}` 
                        });
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }
                
                setProgress({ percent: 30, message: 'Calculating counts...' });
                await new Promise(resolve => setTimeout(resolve, 0));
                
                // Calculate counts
                const n = y.reduce((sum, val) => sum + val, 0);
                const ni = states.map((_, stateIdx) => 
                    x.reduce((sum, row) => sum + row[stateIdx], 0)
                );
                
                setProgress({ percent: 40, message: `Calculating measures for ${states.length} states...` });
                await new Promise(resolve => setTimeout(resolve, 0));
                
                // Calculate importance measures for each state
                const measures = {};
                
                for (let stateIdx = 0; stateIdx < states.length; stateIdx++) {
                    const state = states[stateIdx];
                    
                    // Fussell-Vesely
                    let fi = 0;
                    for (let i = 0; i < N; i++) {
                        if (y[i] === 1 && x[i][stateIdx] === 1) {
                            fi++;
                        }
                    }
                    const FV = n > 0 ? fi / n : 0;
                    
                    // RAW
                    let rawnum = 0;
                    for (let i = 0; i < N; i++) {
                        if (x[i][stateIdx] === 1 && y[i] === 1) {
                            rawnum++;
                        }
                    }
                    const RAW = (ni[stateIdx] > 0 && n > 0) ? (rawnum / ni[stateIdx]) / (n / N) : 0;
                    
                    // RRW
                    let rrwnum = 0;
                    for (let i = 0; i < N; i++) {
                        if (x[i][stateIdx] === 0 && y[i] === 1) {
                            rrwnum++;
                        }
                    }
                    const RRW = (N - ni[stateIdx] > 0 && n > 0) ? (n / N) / (rrwnum / (N - ni[stateIdx])) : 0;
                    
                    // Birnbaum
                    const Birnbaum = (ni[stateIdx] > 0 && (N - ni[stateIdx]) > 0) ? 
                        (rawnum / ni[stateIdx]) - (rrwnum / (N - ni[stateIdx])) : 0;
                    
                    // Barlow-Proschan
                    let fbp = 0;
                    for (let i = 0; i < N; i++) {
                        if (y[i] === 1 && x[i][stateIdx] === 1) {
                            const iter = data.iterations[i];
                            const stateTime = iter.states[state] ? parseTimeToHours(iter.states[state][0]) : 0;
                            
                            let earliestFailureTime = Infinity;
                            systemFailureStates.forEach(failState => {
                                if (iter.states[failState] && iter.states[failState].length > 0) {
                                    const failTime = parseTimeToHours(iter.states[failState][0]);
                                    if (failTime < earliestFailureTime) {
                                        earliestFailureTime = failTime;
                                    }
                                }
                            });
                            
                            if (Math.abs(stateTime - earliestFailureTime) < 0.000001) {
                                fbp++;
                            }
                        }
                    }
                    const BP = n > 0 ? fbp / n : 0;
                    
                    measures[state] = {
                        FV: FV,
                        RAW: RAW,
                        RRW: RRW,
                        Birnbaum: Birnbaum,
                        BP: BP,
                        stateFailures: ni[stateIdx],
                        systemFailureGivenState: fi
                    };
                    
                    if (stateIdx % 5 === 0) {
                        const percent = 40 + Math.floor((stateIdx / states.length) * 60);
                        setProgress({ 
                            percent, 
                            message: `Calculating measures... ${stateIdx} / ${states.length} states` 
                        });
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }
                
                setProgress({ percent: 100, message: 'Complete!' });
                
                setImportanceMeasures({
                    measures: measures,
                    totalIterations: N,
                    totalSystemFailures: n,
                    systemFailureStates: systemFailureStates
                });
                
                setTimeout(() => setShowProgress(false), 1000);
            };

            // Helper function to calculate importance measures for a subset of data
            const calculateMeasuresForSample = (x, y, states, systemFailureStates, dataIterations) => {
                const N = x.length;
                const n = y.reduce((sum, val) => sum + val, 0);
                const ni = states.map((_, stateIdx) => 
                    x.reduce((sum, row) => sum + row[stateIdx], 0)
                );
                
                const measures = {};
                
                states.forEach((state, stateIdx) => {
                    let fi = 0;
                    let rawnum = 0;
                    let rrwnum = 0;
                    let fbp = 0;
                    
                    for (let i = 0; i < N; i++) {
                        if (y[i] === 1 && x[i][stateIdx] === 1) {
                            fi++;
                        }
                        if (x[i][stateIdx] === 1 && y[i] === 1) {
                            rawnum++;
                        }
                        if (x[i][stateIdx] === 0 && y[i] === 1) {
                            rrwnum++;
                        }
                        if (y[i] === 1 && x[i][stateIdx] === 1) {
                            const iter = dataIterations[i];
                            const stateTime = iter.states[state] ? parseTimeToHours(iter.states[state][0]) : 0;
                            let earliestFailureTime = Infinity;
                            systemFailureStates.forEach(failState => {
                                if (iter.states[failState] && iter.states[failState].length > 0) {
                                    const failTime = parseTimeToHours(iter.states[failState][0]);
                                    if (failTime < earliestFailureTime) {
                                        earliestFailureTime = failTime;
                                    }
                                }
                            });
                            if (Math.abs(stateTime - earliestFailureTime) < 0.000001) {
                                fbp++;
                            }
                        }
                    }
                    
                    const FV = n > 0 ? fi / n : 0;
                    const RAW = (ni[stateIdx] > 0 && n > 0) ? (rawnum / ni[stateIdx]) / (n / N) : 0;
                    const RRW = (N - ni[stateIdx] > 0 && n > 0) ? (n / N) / (rrwnum / (N - ni[stateIdx])) : 0;
                    const Birnbaum = (ni[stateIdx] > 0 && (N - ni[stateIdx]) > 0) ? 
                        (rawnum / ni[stateIdx]) - (rrwnum / (N - ni[stateIdx])) : 0;
                    const BP = n > 0 ? fbp / n : 0;
                    
                    measures[state] = { FV, RAW, RRW, Birnbaum, BP };
                });
                
                return measures;
            };

            // Bootstrap resampling calculation
            const calculateBootstrapMeasures = async () => {
                if (!data || systemFailureStates.length === 0) return;
                
                setIsCalculating(true);
                setShowProgress(true);
                setProgress({ percent: 0, message: 'Initializing bootstrap analysis...' });
                
                // Use setTimeout to allow UI to update
                setTimeout(async () => {
                    try {
                        const NendAll = data.iterations.length;
                        const states = data.states;
                        
                        // Determine sample sizes
                        let sampleSizes;
                        if (NendAll === 10000) {
                            sampleSizes = [100, 500, 1000, 2000, 3000, 4000, 5000, 6000, 7500, NendAll];
                        } else if (NendAll === 50000) {
                            sampleSizes = [100, 500, 1000, 2000, 5000, 10000, 15000, 20000, 30000, NendAll];
                        } else {
                            sampleSizes = [100, 500, 5000, 10000, 25000, 50000, 75000, 150000, 250000, NendAll].filter(n => n <= NendAll);
                        }
                        
                        setProgress({ percent: 5, message: `Creating binary matrices for ${NendAll.toLocaleString()} iterations...` });
                        await new Promise(resolve => setTimeout(resolve, 0));
                        
                        // Create full binary matrices
                        const xFull = [];
                        const yFull = [];
                        
                        for (let i = 0; i < data.iterations.length; i++) {
                            const iter = data.iterations[i];
                            const row = [];
                            let systemFailed = false;
                            
                            states.forEach(state => {
                                const stateEntered = iter.states[state] && iter.states[state].length > 0;
                                row.push(stateEntered ? 1 : 0);
                                
                                if (systemFailureStates.includes(state) && stateEntered) {
                                    systemFailed = true;
                                }
                            });
                            
                            xFull.push(row);
                            yFull.push(systemFailed ? 1 : 0);
                            
                            if (i % 5000 === 0 && i > 0) {
                                setProgress({ 
                                    percent: 5 + Math.floor((i / data.iterations.length) * 10), 
                                    message: `Processing iterations... ${i.toLocaleString()} / ${NendAll.toLocaleString()}` 
                                });
                                await new Promise(resolve => setTimeout(resolve, 0));
                            }
                        }
                        
                        // Initialize results storage
                        const results = {
                            sampleSizes: sampleSizes,
                            FV: [],
                            RAW: [],
                            RRW: [],
                            Birnbaum: [],
                            BP: []
                        };
                        
                        const totalSteps = sampleSizes.length * numBootstrap;
                        let completedSteps = 0;
                        
                        // For each sample size
                        for (let sizeIdx = 0; sizeIdx < sampleSizes.length; sizeIdx++) {
                            const N = sampleSizes[sizeIdx];
                            const fvBoot = [];
                            const rawBoot = [];
                            const rrwBoot = [];
                            const birnbaumBoot = [];
                            const bpBoot = [];
                            
                            // Perform bootstrap resampling
                            for (let b = 0; b < numBootstrap; b++) {
                                // Random sampling with replacement
                                const indices = [];
                                for (let i = 0; i < N; i++) {
                                    indices.push(Math.floor(Math.random() * N));
                                }
                                
                                // Create bootstrap sample
                                const xBoot = indices.map(i => xFull[i]);
                                const yBoot = indices.map(i => yFull[i]);
                                const iterBoot = indices.map(i => data.iterations[i]);
                                
                                // Calculate measures for this bootstrap sample
                                const measures = calculateMeasuresForSample(xBoot, yBoot, states, systemFailureStates, iterBoot);
                                
                                // Store results for each state
                                states.forEach(state => {
                                    if (!fvBoot[state]) {
                                        fvBoot[state] = [];
                                        rawBoot[state] = [];
                                        rrwBoot[state] = [];
                                        birnbaumBoot[state] = [];
                                        bpBoot[state] = [];
                                    }
                                    fvBoot[state].push(measures[state].FV);
                                    rawBoot[state].push(measures[state].RAW);
                                    rrwBoot[state].push(measures[state].RRW);
                                    birnbaumBoot[state].push(measures[state].Birnbaum);
                                    bpBoot[state].push(measures[state].BP);
                                });
                                
                                completedSteps++;
                                
                                // Update progress every 5 bootstrap iterations
                                if (b % 5 === 0 || b === numBootstrap - 1) {
                                    const percent = 15 + Math.floor((completedSteps / totalSteps) * 80);
                                    setProgress({ 
                                        percent, 
                                        message: `Bootstrap sample ${completedSteps.toLocaleString()} / ${totalSteps.toLocaleString()} (Sample size: ${N.toLocaleString()})` 
                                    });
                                    await new Promise(resolve => setTimeout(resolve, 0));
                                }
                            }
                            
                            results.FV.push(fvBoot);
                            results.RAW.push(rawBoot);
                            results.RRW.push(rrwBoot);
                            results.Birnbaum.push(birnbaumBoot);
                            results.BP.push(bpBoot);
                        }
                        
                        setProgress({ percent: 100, message: 'Bootstrap analysis complete!' });
                        setBootstrapResults(results);
                        setActiveTab('bootstrap');
                        
                        setTimeout(() => setShowProgress(false), 1000);
                    } catch (err) {
                        setError(`Error in bootstrap calculation: ${err.message}`);
                        setShowProgress(false);
                    } finally {
                        setIsCalculating(false);
                    }
                }, 100);
            };

            const handleFileUpload = (event) => {
                const selectedFile = event.target.files[0];
                if (selectedFile) {
                    setFile(selectedFile);
                    parseFile(selectedFile);
                }
            };

            const parseFile = async (file) => {
                setLoading(true);
                setError(null);
                setShowProgress(true);
                setProgress({ percent: 0, message: 'Reading file...' });
                
                try {
                    const text = await file.text();
                    const lines = text.split('\n');
                    const totalLines = lines.length;
                    
                    setProgress({ percent: 10, message: `Processing ${totalLines.toLocaleString()} lines...` });
                    
                    const iterations = [];
                    let currentIteration = null;
                    const allStates = new Set();
                    
                    // Process lines in chunks to allow progress updates
                    const chunkSize = 10000;
                    let processedLines = 0;
                    
                    for (let chunkStart = 0; chunkStart < lines.length; chunkStart += chunkSize) {
                        const chunkEnd = Math.min(chunkStart + chunkSize, lines.length);
                        
                        for (let i = chunkStart; i < chunkEnd; i++) {
                            let line = lines[i].trim();
                            
                            if (line.startsWith('StartRun:')) {
                                const iterNum = parseInt(line.split(':')[1]);
                                currentIteration = {
                                    iteration: iterNum,
                                    states: {}
                                };
                            } else if (line.startsWith('EnterState:')) {
                                const parts = line.split(',');
                                const stateName = parts[0].replace('EnterState:', '').trim();
                                const timeMatch = parts[1].match(/time:\s*(.+)/);
                                const time = timeMatch ? timeMatch[1].trim() : '0.00:00:00.0';
                                
                                allStates.add(stateName);
                                
                                if (currentIteration) {
                                    if (!currentIteration.states[stateName]) {
                                        currentIteration.states[stateName] = [];
                                    }
                                    currentIteration.states[stateName].push(time);
                                }
                            } else if (line.startsWith('EndOfRun:')) {
                                if (currentIteration) {
                                    iterations.push(currentIteration);
                                }
                            }
                        }
                        
                        processedLines = chunkEnd;
                        const percent = 10 + Math.floor((processedLines / totalLines) * 60);
                        setProgress({ 
                            percent, 
                            message: `Parsing iterations... ${processedLines.toLocaleString()} / ${totalLines.toLocaleString()} lines (${iterations.length} iterations found)` 
                        });
                        
                        // Allow UI to update
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                    
                    setProgress({ percent: 75, message: `Calculating averages for ${allStates.size} states...` });
                    await new Promise(resolve => setTimeout(resolve, 0));
                    
                    // Calculate average times for each state
                    const avgTimes = {};
                    const stateArray = Array.from(allStates);
                    
                    for (let stateIdx = 0; stateIdx < stateArray.length; stateIdx++) {
                        const state = stateArray[stateIdx];
                        const allTimesForState = [];
                        iterations.forEach(iter => {
                            if (iter.states[state]) {
                                iter.states[state].forEach(time => {
                                    allTimesForState.push(parseTimeToHours(time));
                                });
                            }
                        });
                        
                        if (allTimesForState.length > 0) {
                            const nonZeroTimes = allTimesForState.filter(t => t > 0);
                            if (nonZeroTimes.length > 0) {
                                const avg = nonZeroTimes.reduce((sum, t) => sum + t, 0) / nonZeroTimes.length;
                                avgTimes[state] = {
                                    average: avg,
                                    count: nonZeroTimes.length,
                                    totalOccurrences: allTimesForState.length
                                };
                            }
                        }
                        
                        if (stateIdx % 10 === 0) {
                            const percent = 75 + Math.floor((stateIdx / stateArray.length) * 20);
                            setProgress({ 
                                percent, 
                                message: `Calculating averages... ${stateIdx} / ${stateArray.length} states` 
                            });
                            await new Promise(resolve => setTimeout(resolve, 0));
                        }
                    }
                    
                    setProgress({ percent: 100, message: 'Complete!' });
                    
                    setData({
                        iterations,
                        totalIterations: iterations.length,
                        states: stateArray.sort(),
                        avgTimes
                    });
                    
                    setTimeout(() => setShowProgress(false), 1000);
                    
                } catch (err) {
                    setError(`Error parsing file: ${err.message}`);
                    setShowProgress(false);
                } finally {
                    setLoading(false);
                }
            };

            const filteredIterations = useMemo(() => {
                if (!data) return [];
                if (selectedIteration === 'all') return data.iterations;
                return data.iterations.filter(iter => iter.iteration === parseInt(selectedIteration));

            const filteredStates = useMemo(() => {

                    });

                const url = URL.createObjectURL(blob);

                a.download = 'emrald_average_times.csv';

            useEffect(() => {

                        ];
                        const color = colors[index % colors.length];
                        
                        return {
                            label: stateName,
                            data: data.iterations.map(iter => ({
                                x: iter.iteration,
                                y: iter.states[stateName] ? parseTimeToHours(iter.states[stateName][0]) : null

                            backgroundColor: color + '80',

                            pointHoverRadius: 5
                        };

                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: { datasets },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            scales: {
                                x: {
                                    type: 'linear',
                                    title: {
                                        display: true,
                                        text: 'Iteration',
                                        font: { size: 14, weight: 'bold' }
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: 'Time (hours)',

                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top',
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {

                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();

                };
            }, [activeTab, data, selectedStatesForPlot]);

            // Initialize selected states for plot when data loads
            useEffect(() => {
                if (data && data.states.length > 0) {
                    // Select first 5 states by default
                    setSelectedStatesForPlot(data.states.slice(0, Math.min(5, data.states.length)));

            // Render combined bar chart for mean values
            useEffect(() => {
                if (activeTab === 'bootstrap' && bootstrapResults && combinedChartRef.current) {

                    // Calculate mean values at largest sample size
                    const lastIdx = bootstrapResults.sampleSizes.length - 1;
                    const states = data.states;
                    
                    const meanFV = states.map(state => {
                        const vals = bootstrapResults.FV[lastIdx][state];
                        return vals.reduce((a, b) => a + b, 0) / vals.length;

                    const meanRAW = states.map(state => {
                        const vals = bootstrapResults.RAW[lastIdx][state];
                        return vals.reduce((a, b) => a + b, 0) / vals.length;
                    });
                    
                    const meanRRW = states.map(state => {
                        const vals = bootstrapResults.RRW[lastIdx][state];
                        return vals.reduce((a, b) => a + b, 0) / vals.length;

                    const meanBirnbaum = states.map(state => {
                        const vals = bootstrapResults.Birnbaum[lastIdx][state];
                        return vals.reduce((a, b) => a + b, 0) / vals.length;

                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: states.map((_, i) => `C${i+1}`),
                            datasets: [

                                    label: 'Fussell-Vesely',
                                    data: meanFV,
                                    backgroundColor: '#667eea',

                                {
                                    label: 'RAW',
                                    data: meanRAW,
                                    backgroundColor: '#764ba2',
                                },
                                {
                                    label: 'RRW',
                                    data: meanRRW,
                                    backgroundColor: '#f093fb',
                                },
                                {
                                    label: 'Birnbaum',
                                    data: meanBirnbaum,
                                    backgroundColor: '#4facfe',
                                },
                                {

                                    data: meanBP,
                                    backgroundColor: '#43e97b',

                                    title: {

                                        text: 'State'
                                    }

                        if (!canvasRef.current) return;

                        const states = data.states;

                                    title: {
                                        display: true,

                                        font: { size: 16, weight: 'bold' }
                                    },
                                    legend: {
                                        display: true,
                                        position: 'top'
                                    },

                                        callbacks: {
                                            label: function(context) {

                                scales: {

                                            text: 'Sample Size (N)',

                                    y: {
                                        beginAtZero: true,
                                        title: {
                                            display: true,
                                            text: 'Value',
                                            font: { size: 14, weight: 'bold' }
                                        }
                                    }
                                }
                            }
                        });

                    renderBoxplot(fvChartRef, bootstrapResults.FV, 'Fussell-Vesely Convergence', '#667eea');
                    renderBoxplot(rawChartRef, bootstrapResults.RAW, 'RAW Convergence', '#764ba2');
                    renderBoxplot(rrwChartRef, bootstrapResults.RRW, 'RRW Convergence', '#f093fb');
                    renderBoxplot(birnbaumChartRef, bootstrapResults.Birnbaum, 'Birnbaum Convergence', '#4facfe');
                    renderBoxplot(bpChartRef, bootstrapResults.BP, 'Barlow-Proschan Convergence', '#43e97b');
                }
            }, [activeTab, bootstrapResults, data]);

            return (
                <div className="container">
                    <div className="header">

                        <p>Analyze discrete event simulation output files from Idaho National Laboratory's EMRALD tool</p>
                    </div>
                    
                    <div className="content">
                        {!data && (
                            <div className="upload-section">
                                <h2 style={{marginBottom: '20px', color: '#667eea'}}>Upload DebugLog File</h2>
                                <p style={{marginBottom: '20px', color: '#666'}}>
                                    Select an EMRALD DebugLog text file to analyze

                                <input

                                <label htmlFor="fileInput">

                                        Choose File
                                    </button>
                                </label>
                                {file && <p style={{marginTop: '15px', color: '#667eea'}}>Selected: {file.name}</p>}
                            </div>
                        )}
                        
                        {loading && !showProgress && (
                            <div className="loading">
                                <div>Parsing file...</div>
                            </div>
                        )}
                        
                        {showProgress && (
                            <div className="progress-container">
                                <div className="progress-text">{progress.message}</div>
                                <div className="progress-bar-wrapper">
                                    <div className="progress-bar" style={{width: `${progress.percent}%`}}>
                                        {progress.percent}%
                                    </div>
                                </div>
                                <div className="progress-details">
                                    Please wait while processing...
                                </div>
                            </div>
                        )}
                        
                        {error && (
                            <div className="error">
                                {error}
                            </div>
                        )}
                        
                        {data && (
                            <>
                                <div className="stats-grid">
                                    <div className="stat-card">
                                        <h3>Total Iterations</h3>
                                        <div className="value">{data.totalIterations}</div>
                                    </div>
                                    <div className="stat-card">
                                        <h3>Total States</h3>
                                        <div className="value">{data.states.length}</div>
                                    </div>
                                    <div className="stat-card">
                                        <h3>File Name</h3>
                                        <div className="value" style={{fontSize: '18px', wordBreak: 'break-all'}}>
                                            {file.name}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="tabs">
                                    <button 
                                        className={`tab ${activeTab === 'transitions' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('transitions')}
                                    >
                                        State Transition Times
                                    </button>
                                    <button 
                                        className={`tab ${activeTab === 'averages' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('averages')}
                                    >
                                        Average Times
                                    </button>
                                    <button 
                                        className={`tab ${activeTab === 'plot' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('plot')}
                                    >
                                        Plot
                                    </button>
                                    <button 
                                        className={`tab ${activeTab === 'importance' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('importance')}
                                    >
                                        Importance Measures
                                    </button>
                                    <button 
                                        className={`tab ${activeTab === 'bootstrap' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('bootstrap')}
                                    >
                                        Bootstrap Analysis
                                    </button>
                                </div>
                                
                                <div className={`tab-content ${activeTab === 'transitions' ? 'active' : ''}`}>
                                    <h2 className="section-title">State Transition Times</h2>
                                    
                                    <div className="controls">
                                        <div>
                                            <label style={{marginRight: '10px'}}>Iteration:</label>
                                            <select 
                                                value={selectedIteration} 
                                                onChange={(e) => setSelectedIteration(e.target.value)}
                                            >
                                                <option value="all">All Iterations</option>
                                                {data.iterations.map(iter => (
                                                    <option key={iter.iteration} value={iter.iteration}>
                                                        Iteration {iter.iteration}
                                                    </option>
                                                ))}

                                        </div>
                                        
                                        <div>
                                            <label style={{marginRight: '10px'}}>Filter States:</label>
                                            <input

                                                placeholder="Search states..."
                                                value={stateFilter}

                                            />
                                        </div>
                                        
                                        <button onClick={exportToCSV}>
                                            Export to CSV

                                    </div>
                                    
                                    <div className="table-container">
                                        <table className="compact-table">
                                            <thead>
                                                <tr>
                                                    <th style={{position: 'sticky', left: 0, background: '#f5f5f5', zIndex: 11}}>Iteration</th>
                                                    {filteredStates.map(state => (
                                                        <th key={state}>{state}</th>

                                                </tr>
                                            </thead>
                                            <tbody>
                                                {filteredIterations.map(iter => (
                                                    <tr key={iter.iteration}>
                                                        <td style={{position: 'sticky', left: 0, background: 'white', zIndex: 5, fontWeight: 'bold'}}>
                                                            {iter.iteration}
                                                        </td>
                                                        {filteredStates.map(state => (
                                                            <td key={state}>
                                                                {iter.states[state] ? formatTime(parseTimeToHours(iter.states[state][0])) : '-'}
                                                            </td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                
                                <div className={`tab-content ${activeTab === 'averages' ? 'active' : ''}`}>
                                    <h2 className="section-title">Average Time in Each State</h2>
                                    
                                    <div className="controls">
                                        <div>
                                            <label style={{marginRight: '10px'}}>Filter States:</label>
                                            <input 
                                                type="text"
                                                placeholder="Search states..."
                                                value={stateFilter}
                                                onChange={(e) => setStateFilter(e.target.value)}
                                            />
                                        </div>
                                        
                                        <button onClick={exportAvgTimesToCSV}>
                                            Export to CSV
                                        </button>
                                    </div>
                                    
                                    <div className="table-container">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>State Name</th>
                                                    <th>Average Time (hours)</th>
                                                    <th>Non-Zero Occurrences</th>
                                                    <th>Total Occurrences</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {Object.entries(data.avgTimes)
                                                    .filter(([state]) => !stateFilter || state.toLowerCase().includes(stateFilter.toLowerCase()))
                                                    .sort((a, b) => a[0].localeCompare(b[0]))
                                                    .map(([state, stats]) => (
                                                        <tr key={state}>
                                                            <td>{state}</td>
                                                            <td>{formatTime(stats.average)}</td>
                                                            <td>{stats.count}</td>
                                                            <td>{stats.totalOccurrences}</td>
                                                        </tr>
                                                    ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                
                                <div className={`tab-content ${activeTab === 'plot' ? 'active' : ''}`}>
                                    <h2 className="section-title">State Transition Times Plot</h2>
                                    
                                    <div className="chart-controls">
                                        <label style={{marginRight: '10px', fontWeight: 'bold'}}>Select States to Plot:</label>
                                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '10px', marginTop: '10px'}}>
                                            {data.states.map(state => (
                                                <label key={state} style={{display: 'flex', alignItems: 'center', gap: '5px'}}>
                                                    <input 
                                                        type="checkbox"
                                                        checked={selectedStatesForPlot.includes(state)}
                                                        onChange={(e) => {
                                                            if (e.target.checked) {
                                                                setSelectedStatesForPlot([...selectedStatesForPlot, state]);
                                                            } else {
                                                                setSelectedStatesForPlot(selectedStatesForPlot.filter(s => s !== state));
                                                            }
                                                        }}
                                                    />
                                                    <span style={{fontSize: '13px'}}>{state}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {selectedStatesForPlot.length > 0 ? (
                                        <div className="chart-container">
                                            <div className="chart-wrapper">
                                                <canvas ref={chartRef}></canvas>
                                            </div>
                                        </div>
                                    ) : (
                                        <div style={{padding: '40px', textAlign: 'center', color: '#666'}}>
                                            Please select at least one state to display on the plot.
                                        </div>
                                    )}
                                </div>
                                
                                <div className={`tab-content ${activeTab === 'importance' ? 'active' : ''}`}>
                                    <h2 className="section-title">Importance Measures Analysis</h2>
                                    <p style={{marginBottom: '20px', color: '#666'}}>
                                        Based on the reliability importance measures from Borgonovo & Smith. 
                                        Select which states represent system failure to calculate importance measures for all states.
                                    </p>
                                    
                                    <div className="chart-controls">
                                        <label style={{marginRight: '10px', fontWeight: 'bold', display: 'block', marginBottom: '10px'}}>
                                            Select System Failure States:
                                        </label>
                                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '10px', marginBottom: '15px'}}>
                                            {data.states.map(state => (
                                                <label key={state} style={{display: 'flex', alignItems: 'center', gap: '5px'}}>
                                                    <input 
                                                        type="checkbox"
                                                        checked={systemFailureStates.includes(state)}
                                                        onChange={(e) => {
                                                            if (e.target.checked) {
                                                                setSystemFailureStates([...systemFailureStates, state]);
                                                            } else {
                                                                setSystemFailureStates(systemFailureStates.filter(s => s !== state));
                                                            }
                                                        }}
                                                    />
                                                    <span style={{fontSize: '13px'}}>{state}</span>
                                                </label>
                                            ))}
                                        </div>
                                        
                                        <button 
                                            onClick={calculateImportanceMeasures}
                                            disabled={systemFailureStates.length === 0}
                                            style={{
                                                opacity: systemFailureStates.length === 0 ? 0.5 : 1,
                                                cursor: systemFailureStates.length === 0 ? 'not-allowed' : 'pointer'
                                            }}
                                        >
                                            Calculate Importance Measures
                                        </button>
                                        
                                        {systemFailureStates.length === 0 && (
                                            <p style={{marginTop: '10px', color: '#e53e3e', fontSize: '14px'}}>
                                                Please select at least one system failure state
                                            </p>
                                        )}
                                    </div>
                                    
                                    {importanceMeasures && (
                                        <>
                                            <div className="stats-grid" style={{marginTop: '20px'}}>
                                                <div className="stat-card">
                                                    <h3>Total Iterations</h3>
                                                    <div className="value">{importanceMeasures.totalIterations}</div>
                                                </div>
                                                <div className="stat-card">
                                                    <h3>System Failures</h3>
                                                    <div className="value">{importanceMeasures.totalSystemFailures}</div>
                                                </div>
                                                <div className="stat-card">
                                                    <h3>Failure Probability</h3>
                                                    <div className="value" style={{fontSize: '24px'}}>
                                                        {(importanceMeasures.totalSystemFailures / importanceMeasures.totalIterations * 100).toFixed(2)}%
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div className="controls" style={{marginTop: '20px'}}>
                                                <button onClick={() => {
                                                    let csv = 'State,Fussell-Vesely,RAW,RRW,Birnbaum,Barlow-Proschan,State Failures,System Failure Given State\n';
                                                    Object.entries(importanceMeasures.measures)
                                                        .sort((a, b) => a[0].localeCompare(b[0]))
                                                        .forEach(([state, measures]) => {
                                                            csv += `"${state}",${measures.FV.toFixed(6)},${measures.RAW.toFixed(6)},${measures.RRW.toFixed(6)},${measures.Birnbaum.toFixed(6)},${measures.BP.toFixed(6)},${measures.stateFailures},${measures.systemFailureGivenState}\n`;
                                                        });
                                                    const blob = new Blob([csv], { type: 'text/csv' });
                                                    const url = URL.createObjectURL(blob);
                                                    const a = document.createElement('a');
                                                    a.href = url;
                                                    a.download = 'importance_measures.csv';
                                                    a.click();
                                                    URL.revokeObjectURL(url);
                                                }}>
                                                    Export to CSV
                                                </button>
                                            </div>
                                            
                                            <div className="table-container" style={{marginTop: '20px'}}>
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th>State Name</th>
                                                            <th title="Fussell-Vesely: Proportion of system failures where this state failed">
                                                                Fussell-Vesely (FV)
                                                            </th>
                                                            <th title="Risk Achievement Worth: Factor by which system failure probability increases if this state always fails">
                                                                RAW
                                                            </th>
                                                            <th title="Risk Reduction Worth: Factor by which system failure probability decreases if this state never fails">
                                                                RRW
                                                            </th>
                                                            <th title="Birnbaum: Change in system failure probability per unit change in state failure probability">
                                                                Birnbaum
                                                            </th>
                                                            <th title="Barlow-Proschan: Proportion of system failures where this state caused the failure">
                                                                Barlow-Proschan (BP)
                                                            </th>
                                                            <th>State Failures</th>
                                                            <th>System Fail w/ State</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {Object.entries(importanceMeasures.measures)
                                                            .sort((a, b) => b[1].FV - a[1].FV)
                                                            .map(([state, measures]) => (
                                                                <tr key={state}>
                                                                    <td>{state}</td>
                                                                    <td>{measures.FV.toFixed(6)}</td>
                                                                    <td>{measures.RAW.toFixed(6)}</td>
                                                                    <td>{measures.RRW.toFixed(6)}</td>
                                                                    <td>{measures.Birnbaum.toFixed(6)}</td>
                                                                    <td>{measures.BP.toFixed(6)}</td>
                                                                    <td>{measures.stateFailures}</td>
                                                                    <td>{measures.systemFailureGivenState}</td>
                                                                </tr>
                                                            ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                            
                                            <div style={{marginTop: '30px', padding: '20px', background: '#f0f7ff', borderRadius: '8px', borderLeft: '4px solid #667eea'}}>
                                                <h3 style={{marginBottom: '15px', color: '#667eea'}}>Importance Measure Definitions:</h3>
                                                <ul style={{lineHeight: '1.8', color: '#555'}}>
                                                    <li><strong>Fussell-Vesely (FV):</strong> Proportion of system failures where this state failed. Higher values indicate the state is present in most failure scenarios.</li>
                                                    <li><strong>Risk Achievement Worth (RAW):</strong> Factor by which system failure probability would increase if this state always failed. Values &gt; 1 indicate risk increase.</li>
                                                    <li><strong>Risk Reduction Worth (RRW):</strong> Factor by which system failure probability would decrease if this state never failed. Values &gt; 1 indicate potential risk reduction.</li>
                                                    <li><strong>Birnbaum:</strong> Sensitivity of system failure probability to changes in this state's failure probability. Higher absolute values indicate greater influence.</li>
                                                    <li><strong>Barlow-Proschan (BP):</strong> Proportion of system failures where this state's failure time equals the system failure time (i.e., this state caused the system failure).</li>
                                                </ul>
                                            </div>
                                        </>
                                    )}
                                </div>
                                
                                <div className={`tab-content ${activeTab === 'bootstrap' ? 'active' : ''}`}>
                                    <h2 className="section-title">Bootstrap Analysis with Convergence Study</h2>
                                    <p style={{marginBottom: '20px', color: '#666'}}>
                                        Perform bootstrap resampling to assess convergence of importance measures with increasing sample sizes.
                                    </p>
                                    
                                    <div className="chart-controls">
                                        <label style={{marginRight: '10px', fontWeight: 'bold', display: 'block', marginBottom: '10px'}}>
                                            Select System Failure States:
                                        </label>
                                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '10px', marginBottom: '15px'}}>
                                            {data.states.map(state => (
                                                <label key={state} style={{display: 'flex', alignItems: 'center', gap: '5px'}}>
                                                    <input 
                                                        type="checkbox"
                                                        checked={systemFailureStates.includes(state)}
                                                        onChange={(e) => {
                                                            if (e.target.checked) {
                                                                setSystemFailureStates([...systemFailureStates, state]);
                                                            } else {
                                                                setSystemFailureStates(systemFailureStates.filter(s => s !== state));
                                                            }
                                                        }}
                                                    />
                                                    <span style={{fontSize: '13px'}}>{state}</span>
                                                </label>
                                            ))}
                                        </div>
                                        
                                        <div style={{marginBottom: '15px'}}>
                                            <label style={{marginRight: '10px', fontWeight: 'bold'}}>
                                                Number of Bootstrap Samples:
                                            </label>
                                            <input 
                                                type="number"
                                                min="10"
                                                max="1000"
                                                value={numBootstrap}
                                                onChange={(e) => setNumBootstrap(Math.max(10, Math.min(1000, parseInt(e.target.value) || 100)))}
                                                style={{width: '100px'}}
                                            />
                                            <span style={{marginLeft: '10px', color: '#666', fontSize: '14px'}}>
                                                (Recommended: 100-200)
                                            </span>
                                        </div>
                                        
                                        <button 
                                            onClick={calculateBootstrapMeasures}
                                            disabled={systemFailureStates.length === 0 || isCalculating}
                                            style={{
                                                opacity: (systemFailureStates.length === 0 || isCalculating) ? 0.5 : 1,
                                                cursor: (systemFailureStates.length === 0 || isCalculating) ? 'not-allowed' : 'pointer'
                                            }}
                                        >
                                            {isCalculating ? 'Running Analysis...' : 'Run Bootstrap Analysis'}
                                        </button>
                                        
                                        {systemFailureStates.length === 0 && (
                                            <p style={{marginTop: '10px', color: '#e53e3e', fontSize: '14px'}}>
                                                Please select at least one system failure state
                                            </p>
                                        )}
                                    </div>
                                    
                                    {bootstrapResults && (
                                        <>
                                            <div style={{marginTop: '30px'}}>
                                                <h3 className="section-title">Mean Values at Maximum Sample Size</h3>
                                                <div className="chart-container">
                                                    <div style={{height: '400px'}}>
                                                        <canvas ref={combinedChartRef}></canvas>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div style={{marginTop: '30px'}}>
                                                <h3 className="section-title">Convergence Analysis: Fussell-Vesely</h3>
                                                <div className="chart-container">
                                                    <div style={{height: '400px'}}>
                                                        <canvas ref={fvChartRef}></canvas>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div style={{marginTop: '30px'}}>
                                                <h3 className="section-title">Convergence Analysis: RAW</h3>
                                                <div className="chart-container">
                                                    <div style={{height: '400px'}}>
                                                        <canvas ref={rawChartRef}></canvas>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div style={{marginTop: '30px'}}>
                                                <h3 className="section-title">Convergence Analysis: RRW</h3>
                                                <div className="chart-container">
                                                    <div style={{height: '400px'}}>
                                                        <canvas ref={rrwChartRef}></canvas>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div style={{marginTop: '30px'}}>
                                                <h3 className="section-title">Convergence Analysis: Birnbaum</h3>
                                                <div className="chart-container">
                                                    <div style={{height: '400px'}}>
                                                        <canvas ref={birnbaumChartRef}></canvas>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div style={{marginTop: '30px'}}>
                                                <h3 className="section-title">Convergence Analysis: Barlow-Proschan</h3>
                                                <div className="chart-container">
                                                    <div style={{height: '400px'}}>
                                                        <canvas ref={bpChartRef}></canvas>
                                                    </div>
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>
                                
                                <div className="export-section">
                                    <button 
                                        onClick={() => {
                                            setData(null);
                                            setFile(null);
                                            setSelectedIteration('all');
                                            setStateFilter('');
                                            setActiveTab('transitions');
                                            setSelectedStatesForPlot([]);
                                            setSystemFailureStates([]);
                                            setImportanceMeasures(null);
                                            setBootstrapResults(null);
                                            setNumBootstrap(100);
                                        }}
                                        className="upload-button"
                                    >
                                        Load New File
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<EmraldAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
